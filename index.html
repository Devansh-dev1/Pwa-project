<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon and App Icons -->
     <link rel="icon" type="image/png" sizes="32x32" href="/FinalLogo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/FinalLogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/FinalLogo.png" />
    <link rel="shortcut icon" href="/FinalLogo.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
        <!-- Theme Color -->
    <meta name="theme-color" content="#2a46a8" />
    
    <!-- Additional Icon Meta Tags -->
    <meta name="msapplication-TileColor" content="#2a46a8" />
    <meta name="msapplication-TileImage" content="/icon-192x192.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- PWA removed for dev simplicity -->
    <title>ShowTail Web App</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- React ka main module script -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Unregister any service worker during development to avoid stale cache -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()))
      }
    </script>
  </body>
</html>
